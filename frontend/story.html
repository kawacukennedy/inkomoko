<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story — Inkomoko</title>
  <meta name="description" content="Listen to an oral history from The Living Archive.">
  <link rel="stylesheet" href="/css/styles.css?v=6">
  <link rel="stylesheet" href="/css/story.css?v=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#9b2f00">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "inverse-surface": "#323126", "surface-dim": "#dedacb", "tertiary-fixed": "#eae0e6",
            "surface": "#fdf9e9", "on-secondary-fixed-variant": "#6d391e", "secondary-fixed": "#ffdbcc",
            "on-surface": "#1c1c13", "outline-variant": "#e1bfb5", "on-secondary": "#ffffff",
            "inverse-primary": "#ffb59d", "error-container": "#ffdad6", "tertiary-fixed-dim": "#cec4ca",
            "on-primary-container": "#ffece7", "primary-container": "#c2410c", "secondary-container": "#feb28f",
            "background": "#fdf9e9", "on-error-container": "#93000a", "on-tertiary": "#ffffff",
            "surface-container-lowest": "#ffffff", "inverse-on-surface": "#f5f1e1", "surface-tint": "#ac3400",
            "primary": "#9b2f00", "secondary": "#895033", "on-primary": "#ffffff",
            "on-tertiary-container": "#f8edf3", "secondary-fixed-dim": "#ffb694",
            "surface-container-highest": "#e6e3d3", "on-tertiary-fixed": "#1f1a1e",
            "surface-variant": "#e6e3d3", "on-secondary-container": "#794227",
            "primary-fixed-dim": "#ffb59d", "surface-container-low": "#f8f4e4",
            "primary-fixed": "#ffdbd0", "on-surface-variant": "#59413a",
            "surface-container": "#f2eede", "on-primary-fixed": "#390c00",
            "on-secondary-fixed": "#351000", "outline": "#8d7168", "on-background": "#1c1c13",
            "error": "#ba1a1a", "tertiary-container": "#726b70", "on-tertiary-fixed-variant": "#4b454a",
            "tertiary": "#5a5358", "on-primary-fixed-variant": "#832600",
            "on-error": "#ffffff", "surface-bright": "#fdf9e9", "surface-container-high": "#ece8d9"
          },
          "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          "fontFamily": { "headline": ["Noto Serif"], "body": ["Lexend"], "label": ["Lexend"] }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    .leaf-radius { border-radius: 1.5rem 0.5rem 1.5rem 0.5rem; }
  </style>
</head>
<body class="bg-surface text-on-surface font-body">
  <header id="topHeader" class="story-header">
    <div class="story-header-inner">
      <button onclick="window.history.back()" class="story-header-btn" aria-label="Back">
        <span class="material-symbols-outlined" id="backIcon">arrow_back</span>
      </button>
      <button onclick="shareStory()" class="story-header-btn" aria-label="Share">
        <span class="material-symbols-outlined" id="shareIcon">share</span>
      </button>
    </div>
  </header>

  <main id="storyMain" class="story-main">
    <!-- Hero -->
    <div class="story-hero" id="heroSection">
      <div class="story-hero-overlay"></div>
      <div class="story-hero-content" id="heroContent"></div>
    </div>

    <div class="story-content">
      <!-- Elder Info -->
      <section class="elder-info-row" id="elderRow"></section>

      <!-- Engagement Stats -->
      <section class="engagement-row" id="engagementRow"></section>

      <!-- Gratitude Button -->
      <section class="gratitude-section">
        <button onclick="toggleGratitude()" id="gratitudeBtn" class="gratitude-btn">
          <span id="gratitudeEmoji">🙏</span>
          <span id="gratitudeText">Murakoze</span>
          <span id="gratitudeCount">0</span>
        </button>
      </section>

      <!-- Transcript -->
      <section class="transcript-section">
        <div class="transcript-header">
          <h3 class="section-title">Transcript</h3>
          <div class="lang-toggle">
            <button onclick="switchTranscript('kw')" id="transcriptKw" class="lang-btn active">Kinyarwanda</button>
            <button onclick="switchTranscript('en')" id="transcriptEn" class="lang-btn">English</button>
          </div>
        </div>
        <div id="transcriptContent" class="transcript-content"></div>
      </section>

      <!-- Comments -->
      <section class="comments-section">
        <h3 class="section-title" id="commentsTitle">Comments</h3>
        <div id="commentsList" class="comments-list"></div>

        <div class="comment-input-row" id="addComment">
          <textarea id="commentInput" class="form-input comment-input" placeholder="Share your gratitude..."></textarea>
          <button onclick="postComment()" class="comment-send-btn" aria-label="Send">
            <span class="material-symbols-outlined">send</span>
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Sticky Player -->
  <div id="stickyPlayer" class="sticky-player">
    <div class="player-progress-row">
      <span class="player-time" id="playerCurrentTime">0:00</span>
      <div class="player-progress-track" id="progressTrack">
        <div class="player-progress-fill" id="playerProgress"></div>
      </div>
      <span class="player-time" id="playerDuration">0:00</span>
    </div>

    <div class="player-controls">
      <button onclick="skipBack()" class="player-control-btn" aria-label="Skip back">
        <span class="material-symbols-outlined">replay_10</span>
      </button>
      <button onclick="togglePlay()" id="playBtn" class="play-btn" aria-label="Play">
        <span class="material-symbols-outlined filled" id="playIcon">play_arrow</span>
      </button>
      <button onclick="skipForward()" class="player-control-btn" aria-label="Skip forward">
        <span class="material-symbols-outlined">forward_10</span>
      </button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let story = null;
    let isPlaying = false;
    let isGrateful = false;
    let currentTranscript = 'kw';
    let playbackTime = 0;
    let playbackInterval;

    const storyId = new URLSearchParams(window.location.search).get('id');

    if (!storyId) {
      window.location.href = '/explore';
    }

    async function loadStory() {
      try {
        story = await API.getStory(storyId);
        isGrateful = story.is_grateful || false;
        renderStory();
      } catch (err) {
        document.getElementById('storyMain').innerHTML = `
          <div class="empty-state">
            <h2>Story not found</h2>
            <a href="/explore" class="btn-primary">Explore Stories</a>
          </div>`;
      }
    }

    function renderStory() {
      document.title = `${story.title} — Inkomoko`;
      const authorAvatar = Auth.avatarUrl({ full_name: story.author_name });

      document.getElementById('heroContent').innerHTML = `
        <span class="hero-badge">${story.category || 'Story'}${story.era ? ` · ${story.era}` : ''}</span>
        <h1 class="hero-title">${story.title}</h1>
        ${story.description ? `<p class="hero-description">${story.description}</p>` : ''}
      `;

      document.getElementById('elderRow').innerHTML = `
        <img src="${authorAvatar}" alt="${story.author_name}" loading="lazy" class="elder-avatar">
        <div class="elder-details">
          <a href="/elder-profile?id=${story.author_id}" class="elder-name">${story.author_name}</a>
          <p class="elder-meta">${story.author_clan ? story.author_clan + ' · ' : ''}${story.author_region || ''}</p>
        </div>
        <a href="/elder-profile?id=${story.author_id}" class="btn-secondary elder-profile-btn">View Profile</a>
      `;

      document.getElementById('engagementRow').innerHTML = `
        <div class="engagement-item">
          <p class="engagement-value">${story.play_count || 0}</p>
          <p class="engagement-label">Plays</p>
        </div>
        <div class="engagement-item">
          <p class="engagement-value">${story.gratitude_count || 0}</p>
          <p class="engagement-label">Murakoze</p>
        </div>
        <div class="engagement-item">
          <p class="engagement-value">${(story.comments || []).length}</p>
          <p class="engagement-label">Comments</p>
        </div>
      `;

      document.getElementById('gratitudeCount').textContent = story.gratitude_count || 0;
      updateGratitudeBtn();

      renderTranscript();
      renderComments();

      document.getElementById('playerDuration').textContent = Auth.formatDuration(story.duration_seconds);
    }

    function renderTranscript() {
      const el = document.getElementById('transcriptContent');
      const text = currentTranscript === 'kw' ? story.transcript_kinyarwanda : story.transcript_english;

      if (!text) {
        el.innerHTML = `<p class="transcript-empty">No transcript available for this language yet.</p>`;
        return;
      }

      const paragraphs = text.split('" "').map(t => t.replace(/"/g, ''));
      el.innerHTML = paragraphs.map((p, i) => `
        <p class="transcript-paragraph${i === 0 ? ' first-paragraph' : ''}">${p}</p>
      `).join('');
    }

    function switchTranscript(lang) {
      currentTranscript = lang;
      document.getElementById('transcriptKw').classList.toggle('active', lang === 'kw');
      document.getElementById('transcriptEn').classList.toggle('active', lang === 'en');
      renderTranscript();
    }

    function renderComments() {
      const comments = story.comments || [];
      document.getElementById('commentsTitle').textContent = `Comments (${comments.length})`;
      const list = document.getElementById('commentsList');

      if (comments.length === 0) {
        list.innerHTML = '<p class="comments-empty">No comments yet. Be the first to share your gratitude.</p>';
        return;
      }

      list.innerHTML = comments.map(c => {
        const avatar = Auth.avatarUrl({ full_name: c.author_name });
        return `
        <div class="comment-item">
          <img src="${avatar}" alt="${c.author_name}" loading="lazy" class="comment-avatar">
          <div class="comment-bubble">
            <div class="comment-header">
              <span class="comment-author">${c.author_name}</span>
              <span class="comment-time">${Auth.timeAgo(c.created_at)}</span>
            </div>
            <p class="comment-text">${c.content}</p>
          </div>
        </div>`;
      }).join('');
    }

    async function toggleGratitude() {
      if (!Auth.isLoggedIn()) { App.redirectTo('/auth.html'); return; }
      try {
        const result = await API.toggleGratitude(storyId);
        isGrateful = result.grateful;
        const count = parseInt(document.getElementById('gratitudeCount').textContent);
        document.getElementById('gratitudeCount').textContent = isGrateful ? count + 1 : count - 1;
        updateGratitudeBtn();
      } catch (err) {
        console.error('Failed to toggle gratitude:', err);
      }
    }

    function updateGratitudeBtn() {
      document.getElementById('gratitudeBtn').classList.toggle('active', isGrateful);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playIcon').textContent = isPlaying ? 'pause' : 'play_arrow';
      if (isPlaying) simulatePlayback();
    }

    function skipBack() {
      playbackTime = Math.max(0, playbackTime - 10);
      updateProgress();
    }

    function skipForward() {
      playbackTime = Math.min(story.duration_seconds || 300, playbackTime + 10);
      updateProgress();
    }

    function updateProgress() {
      const duration = story.duration_seconds || 300;
      const pct = Math.min((playbackTime / duration) * 100, 100);
      document.getElementById('playerProgress').style.width = pct + '%';
      document.getElementById('playerCurrentTime').textContent = Auth.formatDuration(playbackTime);
    }

    function simulatePlayback() {
      clearInterval(playbackInterval);
      playbackInterval = setInterval(() => {
        if (!isPlaying) { clearInterval(playbackInterval); return; }
        playbackTime++;
        updateProgress();
        if (playbackTime >= (story.duration_seconds || 300)) {
          isPlaying = false;
          document.getElementById('playIcon').textContent = 'play_arrow';
          clearInterval(playbackInterval);
        }
      }, 1000);
    }

    async function postComment() {
      if (!Auth.isLoggedIn()) { App.redirectTo('/auth.html'); return; }
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content) return;

      try {
        await API.addComment(storyId, content);
        input.value = '';
        story = await API.getStory(storyId);
        renderComments();
      } catch (err) {
        Auth.showToast('Failed to post comment', 'error');
      }
    }

    function shareStory() {
      if (navigator.share) {
        navigator.share({ title: story.title, text: story.description, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        Auth.showToast('Link copied!', 'success');
      }
    }

    document.getElementById('progressTrack').addEventListener('click', (e) => {
      const rect = e.target.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      playbackTime = Math.floor(pct * (story.duration_seconds || 300));
      updateProgress();
    });

    window.addEventListener('scroll', () => {
      const header = document.getElementById('topHeader');
      header.classList.toggle('scrolled', window.scrollY > 200);
    });

    loadStory();
  </script>
</body>
</html>

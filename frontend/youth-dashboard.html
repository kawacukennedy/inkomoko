<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youth Dashboard — Inkomoko</title>
  <meta name="description" content="Discover ancestral stories, follow elders, and explore your heritage.">
  <link rel="stylesheet" href="/css/styles.css?v=6">
  <link rel="stylesheet" href="/css/dashboard.css?v=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#9b2f00">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "inverse-surface": "#323126", "surface-dim": "#dedacb", "tertiary-fixed": "#eae0e6",
            "surface": "#fdf9e9", "on-secondary-fixed-variant": "#6d391e", "secondary-fixed": "#ffdbcc",
            "on-surface": "#1c1c13", "outline-variant": "#e1bfb5", "on-secondary": "#ffffff",
            "inverse-primary": "#ffb59d", "error-container": "#ffdad6", "tertiary-fixed-dim": "#cec4ca",
            "on-primary-container": "#ffece7", "primary-container": "#c2410c", "secondary-container": "#feb28f",
            "background": "#fdf9e9", "on-error-container": "#93000a", "on-tertiary": "#ffffff",
            "surface-container-lowest": "#ffffff", "inverse-on-surface": "#f5f1e1", "surface-tint": "#ac3400",
            "primary": "#9b2f00", "secondary": "#895033", "on-primary": "#ffffff",
            "on-tertiary-container": "#f8edf3", "secondary-fixed-dim": "#ffb694",
            "surface-container-highest": "#e6e3d3", "on-tertiary-fixed": "#1f1a1e",
            "surface-variant": "#e6e3d3", "on-secondary-container": "#794227",
            "primary-fixed-dim": "#ffb59d", "surface-container-low": "#f8f4e4",
            "primary-fixed": "#ffdbd0", "on-surface-variant": "#59413a",
            "surface-container": "#f2eede", "on-primary-fixed": "#390c00",
            "on-secondary-fixed": "#351000", "outline": "#8d7168", "on-background": "#1c1c13",
            "error": "#ba1a1a", "tertiary-container": "#726b70", "on-tertiary-fixed-variant": "#4b454a",
            "tertiary": "#5a5358", "on-primary-fixed-variant": "#832600",
            "on-error": "#ffffff", "surface-bright": "#fdf9e9", "surface-container-high": "#ece8d9"
          },
          "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          "fontFamily": { "headline": ["Noto Serif"], "body": ["Lexend"], "label": ["Lexend"] }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    .leaf-radius { border-radius: 1.5rem 0.5rem 1.5rem 0.5rem; }
    .glass-header { background: rgba(253, 249, 233, 0.8); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-surface text-on-surface font-body">
  <header class="fixed top-0 w-full z-50 glass-header shadow-sm shadow-on-surface/5">
    <div class="flex justify-between items-center w-full px-6 py-4">
      <div class="flex items-center gap-4">
        <a href="/" class="text-primary hover:bg-surface-container-low p-2 rounded-full transition-colors">
          <span class="material-symbols-outlined">home</span>
        </a>
        <h1 class="font-headline text-2xl font-black text-primary tracking-tight">The Living Archive</h1>
      </div>
      <div class="flex items-center gap-4">
        <a href="/settings" class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container">
          <img id="navProfileImg" alt="Profile" class="w-full h-full object-cover" src="">
        </a>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="dashboard-container">
      <!-- Greeting -->
      <section class="greeting-section" style="padding-bottom: 1.5rem">
        <h2 class="greeting-title" id="greeting"></h2>
        <p class="greeting-subtitle">Discover stories from your elders</p>
      </section>

      <!-- Elders You Follow -->
      <section class="section">
        <h3 class="section-title">Your Elders</h3>
        <div class="drafts-scroll" id="eldersRow">
          <a href="/explore" class="elder-discover">
            <div class="elder-avatar-add"><span class="material-symbols-outlined">add</span></div>
            <span>Discover</span>
          </a>
        </div>
      </section>

      <!-- Story Feed -->
      <section class="section">
        <h3 class="section-title">Stories For You</h3>
        <div class="story-feed" id="storyFeed">
          <div class="loading-placeholder">Loading stories...</div>
        </div>
      </section>

      <!-- Trending -->
      <section class="section">
        <div class="section-header">
          <h3 class="section-title">Trending Now</h3>
          <a href="/explore" class="section-link">See All</a>
        </div>
        <div class="drafts-scroll" id="trendingScroll">
          <div class="loading-placeholder">Loading...</div>
        </div>
      </section>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="/youth-dashboard" class="bottom-nav-item active">
      <span class="material-symbols-outlined filled">history_edu</span>
      <span class="nav-label">Home</span>
    </a>
    <a href="/library" class="bottom-nav-item">
      <span class="material-symbols-outlined">menu_book</span>
      <span class="nav-label">Library</span>
    </a>
    <a href="/explore" class="bottom-nav-item">
      <span class="material-symbols-outlined">explore</span>
      <span class="nav-label">Explore</span>
    </a>
    <a href="/settings" class="bottom-nav-item">
      <span class="material-symbols-outlined">person</span>
      <span class="nav-label">Profile</span>
    </a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/components.js"></script>
  <script>
    if (!Auth.requireAuth()) throw new Error('Not authenticated');

    const user = Auth.getUser();
    const firstName = (user?.full_name || 'Friend').split(' ')[0];
    document.getElementById('greeting').textContent = `Welcome, ${firstName}`;

    const navImg = document.getElementById('navProfileImg');
    if (navImg && user) {
      navImg.src = Auth.avatarUrl(user);
    }

    async function loadElders() {
      try {
        const feed = await API.getFeed();
        const authors = new Map();

        (feed || []).forEach(s => {
          if (s.author_id && !authors.has(s.author_id)) {
            authors.set(s.author_id, { name: s.author_name, id: s.author_id });
          }
        });

        const container = document.getElementById('eldersRow');
        const discoverBtn = container.firstElementChild.outerHTML;

        container.innerHTML = discoverBtn;

        authors.forEach(elder => {
          const avatar = Auth.avatarUrl({ full_name: elder.name });
          container.innerHTML += `
            <a href="/explore" class="elder-chip">
              <img src="${avatar}" alt="${elder.name}" loading="lazy">
              <span>${elder.name}</span>
            </a>`;
        });
      } catch (err) {
        console.error('Failed to load elders:', err);
      }
    }

    async function loadFeed() {
      try {
        const stories = await API.getFeed();
        const container = document.getElementById('storyFeed');

        if (!stories || stories.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <span class="material-symbols-outlined">library_music</span>
              <p>No stories yet. Start exploring!</p>
              <a href="/explore" class="btn-primary" style="margin-top:1rem">Explore Stories</a>
            </div>`;
        } else {
          container.innerHTML = stories.map(s => {
            const avatar = Auth.avatarUrl({ full_name: s.author_name });
            return `
            <a href="/story?id=${s.id}" class="story-card">
              <div class="story-header">
                <img src="${avatar}" alt="${s.author_name}" loading="lazy" class="story-avatar">
                <div class="story-author">
                  <p class="author-name">${s.author_name}</p>
                  <p class="author-time">${Auth.timeAgo(s.created_at)}</p>
                </div>
                <span class="story-category">${s.category || 'Story'}</span>
              </div>
              <h4 class="story-title">${s.title}</h4>
              ${s.description ? `<p class="story-excerpt">${s.description}</p>` : ''}
              <div class="story-footer">
                <div class="story-actions">
                  <button class="play-btn" onclick="event.stopPropagation(); window.location.href='/story?id=${s.id}'">
                    <span class="material-symbols-outlined filled">play_arrow</span>
                  </button>
                  <div class="waveform">
                    ${[3,5,7,4,6,3,5,4,3,2].map(h => `<div style="height:${h * 3}px"></div>`).join('')}
                  </div>
                  <span class="duration">${Auth.formatDuration(s.duration_seconds)}</span>
                </div>
                <div class="story-stats">
                  <span>🙏 ${s.gratitude_count || 0}</span>
                  <span>▶ ${s.play_count || 0}</span>
                </div>
              </div>
            </a>`;
          }).join('');
        }
      } catch (err) {
        console.error('Failed to load feed:', err);
      }
    }

    async function loadTrending() {
      try {
        const trending = await API.getTrending();
        const container = document.getElementById('trendingScroll');

        if (!trending || trending.length === 0) {
          container.innerHTML = '<div class="loading-placeholder">No trending stories yet</div>';
        } else {
          container.innerHTML = trending.slice(0, 6).map(s => `
            <a href="/story?id=${s.id}" class="trend-card">
              <span class="trend-category">${s.category || 'Story'}</span>
              <h4 class="trend-title">${s.title}</h4>
              <div class="trend-stats">
                <span>▶ ${s.play_count || 0}</span>
                <span>🙏 ${s.gratitude_count || 0}</span>
              </div>
            </a>
          `).join('');
        }
      } catch (err) {
        console.error('Failed to load trending:', err);
      }
    }

    loadElders();
    loadFeed();
    loadTrending();
  </script>
</body>
</html>

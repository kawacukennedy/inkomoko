<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>The Living Archive - Explore</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#323126",
                        "surface-dim": "#dedacb",
                        "tertiary-fixed": "#eae0e6",
                        "surface": "#fdf9e9",
                        "on-secondary-fixed-variant": "#6d391e",
                        "secondary-fixed": "#ffdbcc",
                        "on-surface": "#1c1c13",
                        "outline-variant": "#e1bfb5",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#ffb59d",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#cec4ca",
                        "on-primary-container": "#ffece7",
                        "primary-container": "#c2410c",
                        "secondary-container": "#feb28f",
                        "background": "#fdf9e9",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f5f1e1",
                        "surface-tint": "#ac3400",
                        "primary": "#9b2f00",
                        "secondary": "#895033",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#f8edf3",
                        "secondary-fixed-dim": "#ffb694",
                        "surface-container-highest": "#e6e3d3",
                        "on-tertiary-fixed": "#1f1a1e",
                        "surface-variant": "#e6e3d3",
                        "on-secondary-container": "#794227",
                        "primary-fixed-dim": "#ffb59d",
                        "surface-container-low": "#f8f4e4",
                        "primary-fixed": "#ffdbd0",
                        "on-surface-variant": "#59413a",
                        "surface-container": "#f2eede",
                        "on-primary-fixed": "#390c00",
                        "on-secondary-fixed": "#351000",
                        "outline": "#8d7168",
                        "on-background": "#1c1c13",
                        "error": "#ba1a1a",
                        "tertiary-container": "#726b70",
                        "on-tertiary-fixed-variant": "#4b454a",
                        "tertiary": "#5a5358",
                        "on-primary-fixed-variant": "#832600",
                        "on-error": "#ffffff",
                        "surface-bright": "#fdf9e9",
                        "surface-container-high": "#ece8d9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Lexend"],
                        "label": ["Lexend"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            align-items: start;
        }
        body { min-height: max(884px, 100dvh); }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen pb-32">
    <header class="fixed top-0 w-full z-50 bg-[#fdf9e9]/80 backdrop-blur-md shadow-sm shadow-[#1c1c13]/5">
        <div class="flex justify-between items-center w-full px-6 py-4">
            <div class="flex items-center gap-4">
                <button onclick="if(window.history.length > 1) { window.history.back(); } else { window.location.href='/'; }" class="material-symbols-outlined text-[#9b2f00] hover:bg-[#f8f4e4] p-2 transition-colors duration-300 rounded-full">menu</button>
                <h1 class="font-['Noto_Serif'] text-2xl font-black text-[#9b2f00]">The Living Archive</h1>
            </div>
            <div class="h-10 w-10 rounded-full overflow-hidden border-2 border-primary-container">
                <img id="navProfileImg" alt="User Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAt6Mwz44iTQIhEOTxjdZ6E4JFjiYFpZvkYZ6PI1Ujz42Q0JbeFt7KlhCzfrhH5_pu4y-IQMZABZUxVYOaZ6thLL1UILIYy9_d3XPuByvFUHQQRajHUIoQSV1LahaaiN_EZfjoZERJzHwNkFt29yGRpf2JgNVMGkraEbc-bRCJZlnQBmARe_RVL4iU2KbWOgPRe6C-96aF0X_uWTU1lX-kAaxTRIwApKrxPchUvrWLOu9MfehnjZEqU1bhxDQCG73oBX36efMnOXqT5"/>
            </div>
        </div>
    </header>
    <script>
        setTimeout(() => {
            try { if(window.App && App.currentUser) { document.getElementById("navProfileImg").src = App.avatarUrl(App.currentUser); } } catch(e){}
        }, 100);
    </script>
    <main class="pt-24 px-6 max-w-4xl mx-auto">
        <section class="mb-8">
            <h2 class="font-headline text-3xl font-bold text-primary mb-6 leading-tight">Explore the <span class="bg-gradient-to-br from-primary to-primary-container bg-clip-text text-transparent italic">Ancestral Echoes</span></h2>
            <div class="relative group">
                <div class="absolute inset-y-0 left-6 flex items-center pointer-events-none">
                    <span class="material-symbols-outlined text-outline">search</span>
                </div>
                <input class="w-full h-[64px] pl-16 pr-6 bg-surface-container-lowest border-none shadow-sm rounded-full focus:ring-2 focus:ring-primary-container text-lg placeholder:text-outline/60 transition-all duration-300" id="searchInput" oninput="debounceSearch()" placeholder="Search by name, place, or proverb..." type="text"/>
            </div>
        </section>
        <section class="mb-10 -mx-6 px-6">
            <div class="flex gap-3 overflow-x-auto hide-scrollbar py-2" id="filterChips">
                <button class="flex-shrink-0 px-6 py-3 bg-gradient-to-br from-[#9b2f00] to-[#c2410c] text-white rounded-full font-medium shadow-md flex items-center gap-2" onclick="filterBy(this, '')" data-filter="">
                    <span class="material-symbols-outlined text-sm">tune</span> All Stories
                </button>
                <button class="flex-shrink-0 px-6 py-3 bg-surface-container-high hover:bg-surface-container-highest transition-colors text-on-surface-variant rounded-full font-medium flex items-center gap-2" onclick="filterBy(this, 'story')" data-filter="story">Culture</button>
                <button class="flex-shrink-0 px-6 py-3 bg-surface-container-high hover:bg-surface-container-highest transition-colors text-on-surface-variant rounded-full font-medium flex items-center gap-2" onclick="filterBy(this, 'tradition')" data-filter="tradition">Region</button>
                <button class="flex-shrink-0 px-6 py-3 bg-surface-container-high hover:bg-surface-container-highest transition-colors text-on-surface-variant rounded-full font-medium flex items-center gap-2" onclick="filterBy(this, 'song')" data-filter="song">Type</button>
                <button class="flex-shrink-0 px-6 py-3 bg-surface-container-high hover:bg-surface-container-highest transition-colors text-on-surface-variant rounded-full font-medium flex items-center gap-2" onclick="filterBy(this, 'proverb')" data-filter="proverb">Language</button>
                <button class="flex-shrink-0 px-6 py-3 bg-surface-container-high hover:bg-surface-container-highest transition-colors text-on-surface-variant rounded-full font-medium flex items-center gap-2" onclick="filterBy(this, 'culture')" data-filter="culture">Time Period</button>
            </div>
        </section>
        <section class="masonry-grid pb-12" id="resultsGrid">
        </section>
    </main>

    <nav class="fixed bottom-0 w-full z-50 bg-[#fdf9e9]/90 backdrop-blur-xl rounded-t-[2rem] h-[88px] shadow-[0_-4px_20px_rgba(28,28,19,0.06)] flex justify-around items-center px-4 pb-safe">
        <a class="flex flex-col items-center justify-center text-[#1c1c13]/70 min-h-[56px] p-2 hover:opacity-80 transition-opacity active:scale-95 duration-300" href="/">
            <span class="material-symbols-outlined">history_edu</span>
            <span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-wider mt-1">Home</span>
        </a>
        <a class="flex flex-col items-center justify-center text-[#1c1c13]/70 min-h-[56px] p-2 hover:opacity-80 transition-opacity active:scale-95 duration-300" href="/library.html">
            <span class="material-symbols-outlined">menu_book</span>
            <span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-wider mt-1">Library</span>
        </a>
        <a class="flex flex-col items-center justify-center bg-gradient-to-br from-[#9b2f00] to-[#c2410c] text-white rounded-[24px_8px_24px_8px] min-w-[64px] min-h-[56px] p-2 shadow-lg active:scale-95 duration-300" href="/record.html">
            <span class="material-symbols-outlined">mic_none</span>
            <span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-wider mt-1">Record</span>
        </a>
        <a class="flex flex-col items-center justify-center text-[#1c1c13]/70 min-h-[56px] p-2 hover:opacity-80 transition-opacity active:scale-95 duration-300" href="/settings.html">
            <span class="material-symbols-outlined">person</span>
            <span class="font-['Lexend'] text-[10px] font-medium uppercase tracking-wider mt-1">Profile</span>
        </a>
    </nav>

    <div class="fixed bottom-28 left-6 right-6 z-40" id="playerSlot"></div>

    <script src="/js/api.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/components.js"></script>
    <script>
        let currentFilter = '';
        let currentSearch = '';
        let currentOffset = 0;
        let totalResults = 0;
        let searchTimer = null;
        const leafShapes = ['rounded-[2rem_0.5rem_2rem_0.5rem]', 'rounded-[0.5rem_2rem_0.5rem_2rem]', 'rounded-[2rem_2rem_0.5rem_0.5rem]', 'rounded-[0.5rem_0.5rem_2rem_2rem]'];

        function debounceSearch() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                currentSearch = document.getElementById('searchInput').value.trim();
                currentOffset = 0;
                loadStories(true);
            }, 300);
        }

        function filterBy(btn, filter) {
            currentFilter = filter;
            currentOffset = 0;
            document.querySelectorAll('#filterChips button').forEach(b => {
                b.className = 'flex-shrink-0 px-6 py-3 bg-surface-container-high hover:bg-surface-container-highest transition-colors text-on-surface-variant rounded-full font-medium flex items-center gap-2';
            });
            btn.className = 'flex-shrink-0 px-6 py-3 bg-gradient-to-br from-[#9b2f00] to-[#c2410c] text-white rounded-full font-medium shadow-md flex items-center gap-2';
            loadStories(true);
        }

        function renderStoryCard(s, index) {
            const shape = leafShapes[index % leafShapes.length];
            const hasProgress = s.progress || (Math.random() > 0.5);
            const marginTop = index % 2 === 1 ? 'mt-8' : (index === 2 ? '-mt-8' : '');
            const imgAlt = s.author_name || 'Story';
            const progressBars = hasProgress ? `<div class="flex items-center gap-2 mb-3"><div class="h-3 w-full flex items-end gap-[2px]"><div class="bg-primary-container w-1 h-2 rounded-full"></div><div class="bg-primary-container w-1 h-3 rounded-full"></div><div class="bg-primary-container w-1 h-1 rounded-full"></div><div class="bg-primary-container w-1 h-4 rounded-full"></div><div class="bg-primary-container w-1 h-2 rounded-full"></div><div class="bg-primary-container w-1 h-3 rounded-full"></div><div class="bg-primary-container w-1 h-5 rounded-full"></div></div></div>` : `<div class="flex items-center gap-2 mb-3"><div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden flex items-center"><div class="h-full bg-primary-container w-1/3 rounded-full"></div><div class="h-full bg-primary-container/40 w-1/4 mx-0.5 rounded-full"></div><div class="h-full bg-primary-container/20 w-1/5 rounded-full"></div></div></div>`;
            const durationBadge = s.duration_seconds ? `<div class="absolute bottom-4 left-4 bg-primary/80 backdrop-blur-md px-3 py-1 rounded-full flex items-center gap-1.5"><span class="material-symbols-outlined text-white text-xs">schedule</span><span class="text-white text-xs font-bold uppercase tracking-widest">${App.formatDuration(s.duration_seconds)}</span></div>` : '';

            return `<div class="flex flex-col bg-surface-container-lowest ${shape} overflow-hidden shadow-sm hover:shadow-xl transition-all duration-500 group border border-outline-variant/10 ${marginTop}" onclick="window.location.href='/story.html?id=${s.id}'">
                <div class="relative h-48 overflow-hidden">
                    <img alt="${imgAlt}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCtH9yA6cqpwSlg-WhpCMiYQi4kQA3CUSuAWoBFbwE2Hj0Hw4DfocWgErMQVkbVIQtfMyCn5oOvLc2I8Va4NGDon0KE9tAKk10g1xKso9ilZdVNqhbSuBBM6H7LWrOrZ32Am6nA52tX78iYnUVFwvhx4SKpkQyKrPSTj4LgGLyixjWGstzhoXc8Xv5nrKEdatGAwfaALTmoftXkSRWzNhEnP6gnbjISkhH-pYVqYLvnpqQ5akzKPO3vm_VVJbnLzPrDOuEEoOtazFWK"/>
                    ${durationBadge}
                </div>
                <div class="p-6">
                    ${progressBars}
                    <h3 class="font-headline font-bold text-xl text-primary mb-2">${s.title}</h3>
                    <p class="text-on-surface-variant text-sm line-clamp-2 leading-relaxed">${s.description || ''}</p>
                </div>
            </div>`;
        }

        async function loadStories(replace = false) {
            const params = { limit: 12, offset: currentOffset };
            if (currentFilter) params.category = currentFilter;
            if (currentSearch) params.search = currentSearch;

            try {
                const result = await API.getStories(params);
                totalResults = result.total;
                const grid = document.getElementById('resultsGrid');
                if (replace) grid.innerHTML = '';

                if (result.stories.length === 0 && replace) {
                    grid.innerHTML = `<div class="col-span-2 text-center py-12"><span class="material-symbols-outlined text-6xl text-outline mb-4">search_off</span><h3 class="font-headline text-xl font-bold mb-2">No stories found</h3><p class="text-on-surface-variant">Try different keywords or filters</p></div>`;
                    return;
                }

                result.stories.forEach((s, i) => {
                    grid.innerHTML += renderStoryCard(s, replace ? i : currentOffset + i);
                });

                currentOffset += result.stories.length;
            } catch(e) {
                document.getElementById('resultsGrid').innerHTML = '<p class="col-span-2 text-center text-on-surface-variant">Unable to load stories</p>';
            }
        }

        loadStories(true);
    </script>
</body>
</html>

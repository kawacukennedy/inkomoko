<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Inkomoko</title>
  <meta name="description" content="Sign in or create an account to start preserving or discovering oral histories.">
  <link rel="stylesheet" href="/css/styles.css?v=6">
  <link rel="stylesheet" href="/css/auth.css?v=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#9b2f00">

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "inverse-surface": "#323126", "surface-dim": "#dedacb", "tertiary-fixed": "#eae0e6",
            "surface": "#fdf9e9", "on-secondary-fixed-variant": "#6d391e", "secondary-fixed": "#ffdbcc",
            "on-surface": "#1c1c13", "outline-variant": "#e1bfb5", "on-secondary": "#ffffff",
            "inverse-primary": "#ffb59d", "error-container": "#ffdad6", "tertiary-fixed-dim": "#cec4ca",
            "on-primary-container": "#ffece7", "primary-container": "#c2410c", "secondary-container": "#feb28f",
            "background": "#fdf9e9", "on-error-container": "#93000a", "on-tertiary": "#ffffff",
            "surface-container-lowest": "#ffffff", "inverse-on-surface": "#f5f1e1", "surface-tint": "#ac3400",
            "primary": "#9b2f00", "secondary": "#895033", "on-primary": "#ffffff",
            "on-tertiary-container": "#f8edf3", "secondary-fixed-dim": "#ffb694",
            "surface-container-highest": "#e6e3d3", "on-tertiary-fixed": "#1f1a1e",
            "surface-variant": "#e6e3d3", "on-secondary-container": "#794227",
            "primary-fixed-dim": "#ffb59d", "surface-container-low": "#f8f4e4",
            "primary-fixed": "#ffdbd0", "on-surface-variant": "#59413a",
            "surface-container": "#f2eede", "on-primary-fixed": "#390c00",
            "on-secondary-fixed": "#351000", "outline": "#8d7168", "on-background": "#1c1c13",
            "error": "#ba1a1a", "tertiary-container": "#726b70", "on-tertiary-fixed-variant": "#4b454a",
            "tertiary": "#5a5358", "on-primary-fixed-variant": "#832600",
            "on-error": "#ffffff", "surface-bright": "#fdf9e9", "surface-container-high": "#ece8d9"
          },
          "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
          "fontFamily": { "headline": ["Noto Serif"], "body": ["Lexend"], "label": ["Lexend"] }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    .leaf-radius { border-radius: 1.5rem 0.5rem 1.5rem 0.5rem; }
    .glass-header { background: rgba(253, 249, 233, 0.8); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-surface text-on-surface font-body">
  <header class="fixed top-0 w-full z-50 glass-header shadow-sm shadow-on-surface/5">
    <div class="flex justify-between items-center w-full px-6 py-4">
      <div class="flex items-center gap-4">
        <h1 class="font-headline text-2xl font-black text-primary tracking-tight" style="cursor:pointer" onclick="window.location.href='/'">The Living Archive</h1>
      </div>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-header">
      <div class="auth-icon">
        <span class="material-symbols-outlined filled">local_fire_department</span>
      </div>
      <h2 class="auth-title" id="authTitle">Welcome Back</h2>
      <p class="auth-subtitle" id="authSubtitle">Sign in to continue your journey</p>
    </div>

    <div class="auth-tabs" id="authTabs">
      <button onclick="AuthUI.switchMode('login')" id="loginTab" class="auth-tab active">Sign In</button>
      <button onclick="AuthUI.switchMode('signup')" id="signupTab" class="auth-tab">Create Account</button>
    </div>

    <form id="authForm" onsubmit="AuthUI.handleSubmit(event)">
      <div id="nameGroup" class="form-group hidden">
        <label class="form-label" for="fullName">Full Name</label>
        <input type="text" id="fullName" class="form-input" placeholder="Enter your full name" autocomplete="name">
      </div>

      <div id="identifierGroup" class="form-group">
        <label class="form-label" for="emailPhone">Email or Phone</label>
        <input type="text" id="emailPhone" class="form-input" placeholder="email@example.com or +250..." autocomplete="email">
      </div>

      <div id="passwordGroup" class="form-group">
        <div class="form-group-header">
          <label class="form-label" for="password">Password</label>
          <a href="#" onclick="AuthUI.switchMode('forgot'); return false;" class="form-link">Forgot?</a>
        </div>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" onclick="AuthUI.togglePassword('password')" aria-label="Toggle visibility">
            <span class="material-symbols-outlined" id="passToggleIcon">visibility_off</span>
          </button>
        </div>
        <div id="passwordStrength" class="password-strength hidden">
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span id="strengthText"></span>
        </div>
      </div>

      <div id="otpGroup" class="form-group hidden">
        <label class="form-label">Enter Verification Code</label>
        <p class="otp-hint">A 6-digit code was sent to <strong id="targetIdentifier"></strong></p>
        <input type="text" id="otpCode" class="form-input otp-input" maxlength="6" placeholder="000000" inputmode="numeric" pattern="[0-9]*">
        <p class="otp-resend">Didn't receive it? <a href="#" onclick="AuthUI.resendCode(); return false;">Resend</a></p>
      </div>

      <div id="newPassGroup" class="form-group hidden">
        <label class="form-label" for="newPassword">New Password</label>
        <div class="input-wrapper">
          <input type="password" id="newPassword" class="form-input" placeholder="Minimum 6 characters" autocomplete="new-password">
          <button type="button" onclick="AuthUI.togglePassword('newPassword')" aria-label="Toggle visibility">
            <span class="material-symbols-outlined">visibility_off</span>
          </button>
        </div>
      </div>

      <div id="roleGroup" class="form-group hidden">
        <label class="form-label">I am joining as...</label>
        <div class="role-grid">
          <button type="button" onclick="AuthUI.selectRole('elder')" id="roleElder" class="role-card">
            <div class="role-image"><img src="/assets/images/elder.png" alt="Elder"></div>
            <span class="role-name">Elder</span>
            <p class="role-desc">Share Legacy</p>
          </button>
          <button type="button" onclick="AuthUI.selectRole('youth')" id="roleYouth" class="role-card">
            <div class="role-image"><img src="/assets/images/youth.png" alt="Youth"></div>
            <span class="role-name">Youth</span>
            <p class="role-desc">Learn & Connect</p>
          </button>
        </div>
      </div>

      <div id="errorMsg" class="error-message hidden"></div>

      <button type="submit" id="submitBtn" class="btn-primary btn-full">Sign In</button>
    </form>

    <div id="authBottom" class="auth-bottom">
      <span id="switchText">Don't have an account?</span>
      <a href="#" onclick="AuthUI.toggleLoginSignup(); return false;" id="switchLink" class="form-link">Create one</a>
    </div>

    <a href="#" id="backLink" class="back-link hidden" onclick="AuthUI.switchMode('login'); return false;">
      <span class="material-symbols-outlined">arrow_back</span> Back to Sign In
    </a>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/components.js"></script>
  <script>
    const AuthUI = {
      mode: 'login',
      role: 'youth',
      otpContext: null,

      init() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('mode') === 'signup' || params.get('role')) {
          this.switchMode('signup');
          if (params.get('role')) this.selectRole(params.get('role'));
        }

        const passInput = document.getElementById('password');
        if (passInput) {
          passInput.addEventListener('input', () => this.updatePasswordStrength(passInput.value));
        }

        const otpInput = document.getElementById('otpCode');
        if (otpInput) {
          otpInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').substring(0, 6);
          });
        }

        const idInput = document.getElementById('emailPhone');
        if (idInput) {
          idInput.addEventListener('input', (e) => {
            const val = e.target.value;
            if (/^\+\d/.test(val)) {
              const digits = val.replace(/\D/g, '').substring(0, 12);
              let formatted = '+';
              if (digits.length > 1) {
                formatted += digits.substring(1, 3);
              }
              if (digits.length > 3) {
                formatted += ' ' + digits.substring(3, 6);
              }
              if (digits.length > 6) {
                formatted += ' ' + digits.substring(6, 9);
              }
              if (digits.length > 9) {
                formatted += ' ' + digits.substring(9, 12);
              }
              e.target.value = formatted;
            }
          });
        }
      },

      switchMode(mode) {
        this.mode = mode;
        this.hideError();

        const isLogin = mode === 'login';
        const isSignup = mode === 'signup';
        const isOTP = mode === 'otp';
        const isForgot = mode === 'forgot';
        const isReset = mode === 'reset';

        document.getElementById('authTabs').style.display = (isLogin || isSignup) ? 'flex' : 'none';

        if (isLogin || isSignup) {
          this.updateTabStyle(isLogin);
        }

        this.show('nameGroup', isSignup);
        this.show('identifierGroup', isLogin || isSignup || isForgot || isReset);
        this.show('passwordGroup', isLogin || isSignup);
        this.show('otpGroup', isOTP || isReset);
        this.show('newPassGroup', isReset);
        this.show('roleGroup', isSignup);

        const titles = {
          login: ['Welcome Back', 'Sign in to continue your journey'],
          signup: ['Create Account', 'Join the Living Archive community'],
          otp: ['Verify Identity', 'Enter the code sent to your device'],
          forgot: ['Reset Password', 'Enter your email or phone to receive a code'],
          reset: ['New Password', 'Create a secure new password']
        };

        const btnText = {
          login: 'Sign In', signup: 'Create Account', otp: 'Verify Code',
          forgot: 'Send Reset Code', reset: 'Update Password'
        };

        document.getElementById('authTitle').textContent = titles[mode][0];
        document.getElementById('authSubtitle').textContent = titles[mode][1];
        document.getElementById('submitBtn').textContent = btnText[mode];

        this.show('authBottom', isLogin || isSignup);

        if (isLogin || isSignup) {
          document.getElementById('switchText').textContent = isLogin ? "Don't have an account?" : 'Already have an account?';
          document.getElementById('switchLink').textContent = isLogin ? 'Create one' : 'Sign in';
        }

        this.show('backLink', !isLogin && !isSignup);

        if (isOTP || isReset) {
          setTimeout(() => document.getElementById('otpCode')?.focus(), 100);
        } else if (isLogin) {
          setTimeout(() => document.getElementById('emailPhone')?.focus(), 100);
        }
      },

      updateTabStyle(isLogin) {
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');

        loginTab.classList.toggle('active', isLogin);
        signupTab.classList.toggle('active', !isLogin);
      },

      toggleLoginSignup() {
        this.switchMode(this.mode === 'login' ? 'signup' : 'login');
      },

      selectRole(role) {
        this.role = role;
        const elderBtn = document.getElementById('roleElder');
        const youthBtn = document.getElementById('roleYouth');

        elderBtn.classList.toggle('selected', role === 'elder');
        youthBtn.classList.toggle('selected', role === 'youth');
      },

      togglePassword(id) {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling?.querySelector('.material-symbols-outlined');
        if (!input || !icon) return;

        if (input.type === 'password') {
          input.type = 'text';
          icon.textContent = 'visibility';
        } else {
          input.type = 'password';
          icon.textContent = 'visibility_off';
        }
      },

      updatePasswordStrength(password) {
        const container = document.getElementById('passwordStrength');
        const fill = document.getElementById('strengthFill');
        const text = document.getElementById('strengthText');

        if (!password) {
          container.classList.add('hidden');
          return;
        }

        container.classList.remove('hidden');

        let score = 0;
        if (password.length >= 6) score++;
        if (password.length >= 10) score++;
        if (/[A-Z]/.test(password)) score++;
        if (/[0-9]/.test(password)) score++;
        if (/[^A-Za-z0-9]/.test(password)) score++;

        const levels = [
          { width: '20%', color: '#ba1a1a', text: 'Weak' },
          { width: '40%', color: '#e67e22', text: 'Fair' },
          { width: '60%', color: '#f1c40f', text: 'Good' },
          { width: '80%', color: '#2ecc71', text: 'Strong' },
          { width: '100%', color: '#27ae60', text: 'Excellent' },
        ];

        const level = levels[Math.min(score, 4)];
        fill.style.width = level.width;
        fill.style.backgroundColor = level.color;
        text.textContent = level.text;
        text.style.color = level.color;
      },

      show(id, visible) {
        const el = document.getElementById(id);
        if (visible) {
          el.classList.remove('hidden');
          el.style.display = 'block';
        } else {
          el.classList.add('hidden');
          el.style.display = 'none';
        }
      },

      showError(message) {
        const el = document.getElementById('errorMsg');
        el.textContent = message;
        el.classList.remove('hidden');
      },

      hideError() {
        document.getElementById('errorMsg').classList.add('hidden');
      },

      setLoading(loading, originalText) {
        const btn = document.getElementById('submitBtn');
        btn.disabled = loading;
        btn.textContent = loading ? 'Please wait...' : originalText;
        btn.style.opacity = loading ? '0.7' : '1';
      },

      async handleSubmit(e) {
        if (e) e.preventDefault();
        if (document.getElementById('submitBtn').disabled) return;

        const btn = document.getElementById('submitBtn');
        const btnText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Please wait...';
        btn.style.opacity = '0.7';
        this.hideError();

        try {
          const emailPhone = document.getElementById('emailPhone').value.trim();
          const password = document.getElementById('password').value;
          const otpCode = document.getElementById('otpCode').value.trim();
          const newPassword = document.getElementById('newPassword').value;

          switch (this.mode) {
            case 'login':
            case 'signup':
              await this.handleAuthStep(emailPhone, password);
              break;
            case 'otp':
              await this.handleOtpStep(otpCode);
              break;
            case 'forgot':
              await this.handleForgotStep(emailPhone);
              break;
            case 'reset':
              await this.handleResetStep(otpCode, newPassword);
              break;
          }
        } catch (err) {
          btn.disabled = false;
          btn.textContent = btnText;
          btn.style.opacity = '1';
          this.showError(err.message || 'Something went wrong. Please try again.');
        }
      },

      async handleAuthStep(identifier, password) {
        if (!identifier) throw new Error('Email or phone is required');
        if (!password) throw new Error('Password is required');

        const isEmail = identifier.includes('@');
        const data = {
          email: isEmail ? identifier : null,
          phone: !isEmail ? identifier : null,
          password,
        };

        if (this.mode === 'signup') {
          const name = document.getElementById('fullName').value.trim();
          if (!name) throw new Error('Full name is required');
          if (name.length < 2) throw new Error('Name is too short');

          data.full_name = name;
          data.role = this.role;
        }

        const result = this.mode === 'signup' ? await API.signup(data) : await API.login(data);

        if (result.otp_required) {
          document.getElementById('targetIdentifier').textContent = identifier;
          this.otpContext = { identifier, purpose: result.purpose || this.mode };
          this.switchMode('otp');
          return;
        }

        if (result.token && result.user) {
          Auth.setSession(result.user, result.token);
          Auth.redirectAfterAuth();
        }
      },

      async handleOtpStep(code) {
        if (!code) throw new Error('Verification code is required');
        if (!/^\d{6}$/.test(code)) throw new Error('Code must be 6 digits');
        if (!this.otpContext) throw new Error('Session expired. Please start over.');

        const result = await API.verifyOTP({
          identifier: this.otpContext.identifier,
          code,
          purpose: this.otpContext.purpose,
        });

        if (result.token && result.user) {
          Auth.setSession(result.user, result.token);
          Auth.redirectAfterAuth();
        } else {
          throw new Error('Verification failed');
        }
      },

      async handleForgotStep(identifier) {
        if (!identifier) throw new Error('Email or phone is required');

        await API.forgotPassword(identifier);

        this.otpContext = { identifier, purpose: 'reset' };
        document.getElementById('targetIdentifier').textContent = identifier;
        this.switchMode('reset');
      },

      async handleResetStep(code, newPassword) {
        if (!code) throw new Error('Verification code is required');
        if (!newPassword) throw new Error('New password is required');
        if (newPassword.length < 6) throw new Error('Password must be at least 6 characters');
        if (!this.otpContext) throw new Error('Session expired. Please start over.');

        await API.resetPassword({
          identifier: this.otpContext.identifier,
          code,
          new_password: newPassword,
        });

        Auth.showToast('Password updated! Please sign in.', 'success');
        this.switchMode('login');
      },

      async resendCode() {
        if (!this.otpContext) return;

        const btn = document.getElementById('submitBtn');
        const originalText = btn.textContent;
        this.setLoading(true, originalText);

        try {
          if (this.otpContext.purpose === 'reset') {
            await API.forgotPassword(this.otpContext.identifier);
          } else {
            const identifier = this.otpContext.identifier;
            const isEmail = identifier.includes('@');
            const data = {
              email: isEmail ? identifier : null,
              phone: !isEmail ? identifier : null,
              password: 'resend',
            };

            if (this.otpContext.purpose === 'signup') {
              data.full_name = document.getElementById('fullName').value.trim();
              data.role = this.role;
              await API.signup(data);
            } else {
              await API.login(data);
            }
          }

          Auth.showToast('Code resent', 'success');
        } catch (err) {
          this.showError(err.message || 'Failed to resend code');
        } finally {
          this.setLoading(false, originalText);
        }
      },
    };

    AuthUI.init();
  </script>
</body>
</html>

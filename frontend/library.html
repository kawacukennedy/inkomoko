    <script>
        App.init();
        const categoryIcons = { story: '📖', tradition: '🏺', song: '🎵', proverb: '💬', culture: '🏛' };

        async function loadLibrary() {
            try {
                const featured = await API.getFeatured();
                if (featured) {
                    document.getElementById('featuredTitle').textContent = featured.title;
                    document.getElementById('featuredDesc').textContent = featured.description || '"A story told by many voices never dies."';
                    const go = () => window.location.href = `/story.html?id=${featured.id}`;
                    document.getElementById('featuredSection').querySelector('.group').onclick = go;
                    document.getElementById('featuredPlayBtn').onclick = (e) => { e.stopPropagation(); go(); };
                }
            } catch(e) {}

            try {
                const nearMe = await API.getNearMe(App.currentUser?.region || '');
                const region = App.currentUser?.region || 'Rwanda';
                document.getElementById('nearMeRegion').textContent = region;
                const grid = document.getElementById('nearMeGrid');
                grid.innerHTML = nearMe.slice(0, 3).map(s => `
                    <div class="vintage-overlay bg-surface-container-lowest rounded-xl p-6 shadow-sm flex flex-col gap-4 border border-outline-variant/15 hover:shadow-xl transition-shadow duration-300 cursor-pointer" onclick="window.location.href='/story.html?id=${s.id}'">

                        </div>

                            <div class="flex justify-between items-center text-xs font-label uppercase tracking-widest text-primary-container font-bold">
                                <span>${s.category || 'Story'}</span>
                                <span>${App.formatDuration(s.duration_seconds)}</span>
                            </div>
                            <h4 class="font-headline text-xl font-bold text-on-surface">${s.title}</h4>
                            <p class="font-body text-on-surface-variant line-clamp-3">${s.description || ''}</p>
                        </div>
                        <button class="mt-auto tap-target w-full flex items-center justify-between px-4 rounded-lg bg-surface-container-low text-primary font-bold hover:bg-surface-container-high transition-colors">
                            Explore Story <span class="material-symbols-outlined">arrow_forward</span>
                        </button>

            } catch(e) {}

                const archive = await API.getArchive();
                const archGrid = document.getElementById('archiveGrid');

                                <h4 class="font-headline text-3xl font-black text-on-surface mt-2 mb-4">${archive[0]?.title || 'Archive Story'}</h4>

                document.querySelector('main').appendChild(statsEl);
            } catch(e) {}

        loadLibrary();
